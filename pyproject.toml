[project]
name = "Grinning-Cat"
description = "Production ready AI assistant framework"
version = "2.0.1"
requires-python = ">=3.11,<3.14"
license-files = ["LICENSE"]
authors = [
    { name = "Matteo Cacciola" },
    { name = "Piero Savastano" },
    { name = "Cheshire Cat AI Contributors" },
]
dependencies = [
    "aiofiles",
    "asgi-lifespan",
    "autopep8",
    "bcrypt",
    "cryptography",
    "fastapi",
    "fastapi-healthz[redis]",
    "fastmcp",
    "filetype",
    "gunicorn",
    "httpx",
    "httpx-ws",
    "langchain",
    "beautifulsoup4",
    "lxml",
    "loguru",
    "perflint",
    "pillow",
    "pymupdf",
    "pydantic",
    "PyJWT",
    "pylint",
    "pylint-actions",
    "pytest",
    "pytest-asyncio",
    "python-multipart",
    "python-slugify",
    "pandas",
    "qdrant_client",
    "rapidfuzz",
    "redis",
    "ruff",
    "scalar-fastapi",
    "scikit-learn",
    "tiktoken",
    "tomli",
    "uvicorn[standard]",
    "websockets",
]

# Aggregated dependencies of every plugin deployed with this core
# (external repos in ~/git/plugins + in-repo core_plugins). Keeping them in
# the lock lets `uv sync --extra plugins` preinstall the whole runtime
# environment (libraries + models) in one deterministic step.
# Bounds are aligned across plugins: conflicting pins (e.g.
# sentence-transformers==4.1.0 vs >=5.1.2, unstructured==0.18.1 vs >=0.22)
# are resolved to the newer, shared versions.
[project.optional-dependencies]
plugins = [
    # --- cat_alog ---
    "langchain-core>=1.3.0",
    # --- cat-graphrag(.my) ---
    "langdetect>=1.0.9",
    "neo4j>=6.1.0",
    "spacy>=3.8.14",
    "spacy-transformers>=1.4.0",
    "numpy>=2.4.4",
    # --- cat-search ---
    "googlesearch-python",
    # --- cat_with_google_drive ---
    "google-api-python-client>=2.194.0",
    "google-api-python-client-stubs>=1.35.0",
    "google-auth-oauthlib>=1.3.1",
    "google-auth-httplib2>=0.3.1",
    # --- cat-with-your-data ---
    "langchain-experimental",
    "mysql-connector-python",
    "psycopg2-binary",
    "tabulate==0.9.0",
    # --- ccat-reranker (aligned pins) ---
    "sentence-transformers>=5.1.2",
    "unstructured[all-docs]>=0.22",
    # --- cc_prompt_settings ---
    "translate>=3.8.0",
    # --- cc_scrapycat ---
    "bs64",
    "crawl4ai[pdf]>=0.8.6",
    # --- exercise-generator-plugin ---
    "pandas>=3.0.2",
    "pydantic>=2.13.2",
    # --- GC---Math-Solver ---
    "sympy",
    # --- grinning_cat_plus(.my) ---
    "audioop-lts; python_version >= '3.13'",
    "azure-storage-blob>=12.27.0",
    "boto3>=1.40.57",
    "fastembed>=0.7.3",
    "faster-whisper",
    "google-cloud-storage>=3.4.1",
    "langchain-anthropic>=1.0.0",
    "langchain-cohere>=0.4.6",
    "langchain-google-genai>=3.0.0",
    "langchain-groq>=1.0.0",
    "langchain-mistralai>=1.0.0",
    "langchain-ollama>=1.0.0",
    "langchain-openai>=1.0.1",
    "langchain-unstructured>=0.1.6",
    "langchain-voyageai>=0.1.7",
    "nltk>=3.9.2",
    "odfpy",
    "openpyxl>=3.1.0",
    "pdfminer-six>=20260107",
    "pydub",
    "python-pptx>=1.0.0",
    "pytube>=15.0.0",
    "text-generation>=0.7.0",
    "xlrd>=2.0.1",
    "youtube-transcript-api>=1.2.3",
    # --- grinning-cat-weaviate ---
    "weaviate-client",
    # --- core_plugins/base_plugin ---
    "bs4",
    "pymupdf",
    # --- core_plugins/white_rabbit ---
    "apscheduler",
]

[tool.coverage.run]
source = ["cat"]
branch = true
omit = [
    "tests/*",
]

[tool.pylint]
max-line-length = 180
disable = [
    "C0301",
    "C0103",
    "C0114",
    "E1120",
    "E0401",
    "C0115",
    "C0116",
    "E1101",
    "R0801",
    "C0202",
    "W0406",
    "W1514",
    "W0201",
    "W0511",
    "E722",
    "F821",
    "E741",
]

[tool.pylint.main]
load-plugins = "pylint_actions, perflint"

[tool.setuptools]
packages = ["cat"]

[tool.ruff]
extend-ignore = ["E722", "F821", "E741"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
